name: kashi_sync
description: Offline-first sync for Flutter apps on Drift, with a transactional outbox with batched push and retries, and a cursor-based pull that never overwrites unsent edits.
version: 1.6.0-test
repository: https://github.com/softwareseva/kashi
issue_tracker: https://github.com/softwareseva/kashi/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

dependencies:
  drift: ^2.35.0
  flutter:
    sdk: flutter
  kashi_core: ^1.0.0

dev_dependencies:
  dio: ^5.11.1
  flutter_lints: ^6.0.0
  flutter_secure_storage: ^11.2.0
  flutter_test:
    sdk: flutter
