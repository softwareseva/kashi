name: kashi_list
description: Searchable, sortable, infinitely scrolling lists for kashi keyset APIs in Flutter. A directory controller and a Cupertino KDataList widget with pull-to-refresh, a sort sheet, and loading, empty and error states.
version: 0.1.0
repository: https://github.com/softwareseva/kashi
issue_tracker: https://github.com/softwareseva/kashi/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  kashi_core: ^0.1.0
  kashi_ui: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
