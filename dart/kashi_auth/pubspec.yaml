name: kashi_auth
description: Flutter sign-in for @softwareseva/auth APIs. One-time codes over WhatsApp/SMS/email, password, Google, Sign in with Apple and passkeys through small adapters, a Cupertino sign-in screen on kashi_ui, passkey management and a biometric app lock. No native plugins are required by this package.
version: 0.1.0
repository: https://github.com/softwareseva/kashi
issue_tracker: https://github.com/softwareseva/kashi/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  kashi_core: ^0.1.0
  kashi_ui: ^0.1.0

dev_dependencies:
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
