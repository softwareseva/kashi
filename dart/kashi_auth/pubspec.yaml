name: kashi_auth
description: Flutter sign-in for kashi APIs, with default passkeys (contact-free sign-up), codes, password, Google/Apple/Facebook, a sign-in screen, passkey settings and biometric lock.
version: 1.1.0
repository: https://github.com/softwareseva/kashi
issue_tracker: https://github.com/softwareseva/kashi/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  kashi_core: ^1.0.0
  kashi_ui: ^1.0.0

dev_dependencies:
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
