name: mobile-release

# Manual run, or push a tag like mobile-v1.4.0 to ship both platforms to their test tracks.
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [both, ios, android]
        default: both
      lane:
        type: choice
        options: [beta, release]
        default: beta
  push:
    tags: ["mobile-v*"]

env:
  LANE: ${{ inputs.lane || 'beta' }}
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  ios:
    if: ${{ (inputs.platform || 'both') != 'android' }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: {{APP_DIR}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: {{FLUTTER_VERSION}}
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: {{APP_DIR}}
      - run: flutter pub get
      - run: bundle exec fastlane ios "$LANE"
        working-directory: {{APP_DIR}}/ios
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/{{APP_DIR}}/Gemfile
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

  android:
    if: ${{ (inputs.platform || 'both') != 'ios' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: {{APP_DIR}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: {{FLUTTER_VERSION}}
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: {{APP_DIR}}
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" > android/key.properties
      - run: flutter pub get
      - run: bundle exec fastlane android "$LANE"
        working-directory: {{APP_DIR}}/android
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/{{APP_DIR}}/Gemfile
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
