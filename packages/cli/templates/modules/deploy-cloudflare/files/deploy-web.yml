name: deploy-web

# Builds the Vite app and serves it with Workers static assets (SPA fallback to index.html).
on:
  push:
    branches: [main]
    paths: ["{{WEB_DIR}}/**", ".github/workflows/deploy-web.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-web-${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: {{WEB_DIR}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: pnpm exec wrangler deploy --env "$TARGET"
