name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run check:tokens
      - run: pnpm run check:skills
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed dart
      - run: flutter analyze dart
      - run: for p in dart/*/; do (cd "$p" && [ -d test ] && flutter test) || true; done
