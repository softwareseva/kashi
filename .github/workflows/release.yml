name: release
on:
  push: { branches: [main] }
concurrency: release
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, id-token: write }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm, registry-url: https://registry.npmjs.org }
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keep every dart/kashi_* package in lockstep with @softwareseva/core and publish those too —
      # the dart equivalent of `changesets/action`'s publish step, since dart packages don't go
      # through changesets. See scripts/sync-dart-versions.sh.
      #
      # Deliberately not gated on `steps.changesets.outputs.published`: that output stayed false
      # for a real `pnpm run release` publish (1.6.0), so the dart bump was silently skipped. The
      # script is idempotent instead: it does nothing while dart already matches the npm version
      # (every run except the one right after the "Version Packages" PR merges).
      - name: Sync dart/kashi_* package versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/sync-dart-versions.sh "$(jq -r .version packages/core/package.json)"
